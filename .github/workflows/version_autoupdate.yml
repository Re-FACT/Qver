name: Version AutoUpdate
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Update the commit id when a major/minor version update is required
  BRANCH_NAME: version_autoupdate
  COMMIT_TITLE: "Version number auto-update"

jobs:
  patch-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: Re-FACT/refact_infra
          path: utils/refact_infra

      - name: Insert Patch Count
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          make update_version FORCE_COMMIT_VERSION_UPDATE=on INFRA_ROOT=utils/refact_infra

      - name: Push changes # push the output folder to your repo
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{env.BRANCH_NAME}}
          force: true

      - name: Create Auto PR
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{env.BRANCH_NAME}}           # name of branch for PR
          destination_branch: "main"                      # name of branch on which PR go
          pr_title: "Version bump for ${{ github.ref }} into main" # Title of pull request
          pr_body: ":crown: *An automated PR* for version update"  # Full markdown support, requires pr_title
          pr_reviewer: ${{ github.repository_owner }}  # Comma-separated list (no spaces)
          pr_assignee: ${{ github.repository_owner }}  # Comma-separated list (no spaces)
          pr_label: "auto-pr"                               # Comma-separated list (no spaces)
          pr_allow_empty: true                              # Creates pull request even if there are no changes
          github_token: ${{ secrets.GITHUB_TOKEN }}
